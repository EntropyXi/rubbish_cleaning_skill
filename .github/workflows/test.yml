name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q scripts tests

      - name: Python 3.10 compatibility lint
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          forbidden_imports = {"tomllib", "zoneinfo", "graphlib"}
          failures = []
          for path in [p for root in (pathlib.Path("scripts"), pathlib.Path("tests")) for p in root.rglob("*.py")]:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              annotation_ids = set()
              for parent in ast.walk(tree):
                  annotation = None
                  if isinstance(parent, ast.arg):
                      annotation = parent.annotation
                  elif isinstance(parent, ast.AnnAssign):
                      annotation = parent.annotation
                  elif isinstance(parent, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      annotation = parent.returns
                  if annotation is not None:
                      annotation_ids.update(id(node) for node in ast.walk(annotation))
              if any(isinstance(node, getattr(ast, "Match", ())) for node in ast.walk(tree)):
                  failures.append((str(path), "match statement"))
              if any(isinstance(node, ast.NamedExpr) for node in ast.walk(tree)):
                  failures.append((str(path), "walrus operator"))
              if any(isinstance(node, ast.BinOp) and isinstance(node.op, ast.BitOr) and id(node) in annotation_ids for node in ast.walk(tree)):
                  failures.append((str(path), "union/bitwise-or operator"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      modules = [alias.name.split(".", 1)[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      modules = [node.module.split(".", 1)[0]] if node.module else []
                  else:
                      continue
                  for module in modules:
                      if module in forbidden_imports:
                          failures.append((str(path), "3.11+ import: " + module))
          if failures:
              print("compatibility lint: FAIL")
              for item in failures:
                  print(item)
              sys.exit(1)
          print("compatibility lint: PASS")
          PY

      - name: Run pytest suite
        shell: bash
        run: python -m pytest tests/ -x --tb=short

      - name: Scanner integration smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/scanner.py -Drive 'D:' -Categories root-temps,root-logs

      - name: Scanner integration smoke (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: python scripts/scanner.py -Drive / -Categories root-temps,root-logs

      # FM12 / Todo 12: real-app clean integration test (windows-latest only).
      # Builds a small fake "app" with a Cache dir (5 files) + a data file,
      # runs the real scanner -> cleaner (clean_contents) pipeline against it,
      # then verifies: (a) cache files gone, (b) Cache dir still exists,
      # (c) the app's data file untouched, (d) a "still starts" marker script
      # reads the data file and exits 0. No real apps, no elevated cleanup.
      - name: Real-app clean integration (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          workspace = Path.cwd()
          root = Path(tempfile.mkdtemp(prefix="fake-app-"))
          app = root / "Ubisoft Game Launcher"
          cache = app / "cache"
          cache.mkdir(parents=True)
          cache_files = []
          for index in range(5):
              cache_file = cache / f"f_{index:06d}"
              cache_file.write_text("cache", encoding="utf-8")
              cache_files.append(cache_file)
          data_file = app / "data.txt"
          data_content = "app-user-data-0123456789"
          data_file.write_text(data_content, encoding="utf-8")
          marker = app / "start_marker.py"
          marker.write_text(
              "import pathlib, sys; "
              f"sys.exit(0 if pathlib.Path({str(data_file)!r}).read_text(encoding='utf-8') == {data_content!r} else 1)\n",
              encoding="utf-8",
          )
          out_dir = root / "out"
          quarantine_dir = root / "quarantine"
          volume = {"Root": str(root), "FreeBytes": 1000, "TotalBytes": 5000}
          env = os.environ.copy()
          env["PYTHONPATH"] = str(workspace) + os.pathsep + env.get("PYTHONPATH", "")

          def run(code):
              return subprocess.run(
                  [sys.executable, "-c", code], cwd=workspace, env=env,
                  text=True, capture_output=True,
              )

          scanner_code = "\n".join([
              "from pathlib import Path",
              "import runpy, sys",
              "from unittest import mock",
              "import psutil",
              "from scripts.lib import core, platform",
              "platform.IS_WINDOWS = True",
              "core.IS_WINDOWS = (sys.platform == 'win32')",
              f"platform.resolve_fixed_drive = lambda drive: {volume!r}",
              f"sys.argv = ['scanner.py','-Drive','X:','-OutDir',{str(out_dir)!r},'-Categories','app-caches']",
              "with mock.patch.object(psutil, 'process_iter', return_value=[]):",
              f"    runpy.run_path({str(workspace / 'scripts' / 'scanner.py')!r}, run_name='__main__')",
          ])
          scan = run(scanner_code)
          assert scan.returncode == 0, scan.stderr
          assert "SCAN COMPLETE:" in scan.stdout
          run_dir = max(out_dir.glob("*-*"), key=lambda path: path.stat().st_mtime_ns)
          candidates = run_dir / "candidates.csv"
          assert candidates.is_file()
          assert "app-caches|SAFE|" in candidates.read_text(encoding="utf-8")

          cleaner_code = "\n".join([
              "from pathlib import Path",
              "import runpy, sys",
              "from unittest import mock",
              "import psutil",
              "from scripts.lib import core, platform",
              "platform.IS_WINDOWS = True",
              "core.IS_WINDOWS = (sys.platform == 'win32')",
              f"platform.resolve_fixed_drive = lambda drive: {volume!r}",
              f"sys.argv = ['cleaner.py','-Drive','X:','-CandidatesCsv',{str(candidates)!r},'-QuarantineDir',{str(quarantine_dir)!r},'-Yes']",
              "with mock.patch.object(psutil, 'process_iter', return_value=[]):",
              f"    runpy.run_path({str(workspace / 'scripts' / 'cleaner.py')!r}, run_name='__main__')",
          ])
          clean = run(cleaner_code)
          assert clean.returncode == 0, clean.stderr
          assert "CLEAN COMPLETE:" in clean.stdout
          cleanup_text = (run_dir / "cleanup-errors.csv").read_text(encoding="utf-8")
          assert cleanup_text.count("|OK\n") == 5, "FM12: all 5 cache files must be deleted"

          # (a) cache files gone, (b) Cache dir still exists, (c) data intact.
          assert all(not file.exists() for file in cache_files), "FM12: cache files must be freed"
          assert cache.is_dir(), "FM12: clean_contents must keep the Cache dir"
          assert data_file.read_text(encoding="utf-8") == data_content, "FM12: app data must be intact"

          # (d) app still starts: the marker reads the data file and exits 0.
          start = run(f"import runpy; runpy.run_path({str(marker)!r}, run_name='__main__')")
          assert start.returncode == 0, f"FM12: app no longer starts: {start.stderr}"
          print("REAL-APP CLEAN INTEGRATION: PASS")
          PY

  # Bounded, required stress verification.  It remains separate from the
  # 3-OS x 3-Python functional matrix because it exercises load-specific L1,
  # L2 and L4 scenarios on Ubuntu and Windows.
  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Create isolated stress paths and fixed CI profile
        shell: bash
        run: |
          python - <<'PY'
          import os
          import stat
          import tempfile
          import uuid
          from pathlib import Path

          def assert_no_link_ancestor(path):
              current = path
              while True:
                  info = os.lstat(current)
                  attrs = getattr(info, "st_file_attributes", 0)
                  reparse = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0)
                  if stat.S_ISLNK(info.st_mode) or attrs & reparse:
                      raise RuntimeError("temporary path has a link ancestor: " + str(current))
                  if current.parent == current:
                      return
                  current = current.parent

          parent = Path(tempfile.gettempdir()).resolve()
          assert_no_link_ancestor(parent)
          token = uuid.uuid4().hex
          root = parent / ("rubbish-stress-" + os.environ["GITHUB_RUN_ID"] + "-" + token)
          status = parent / ("rubbish-stress-link-status-" + token + ".json")
          if root.exists() or status.exists():
              raise RuntimeError("stress paths must not exist before the fixture owns them")
          values = {
              "RUBBISH_STRESS_ROOT": root.as_posix(),
              "RUBBISH_STRESS_STATUS_FILE": status.as_posix(),
              "STRESS_L2_PROFILE": "ci",
              "STRESS_100K_COUNT": "5000",
              # Measured locally with seed 42: 12 worlds complete in about
              # 106 seconds.  Twelve deterministic worlds retain meaningful
              # scanner/cleaner coverage while keeping L4 inside its fixed
              # 120-second slice of the 540-second suite envelope.
              "FUZZ_ITERS": "12",
              "FUZZ_PER_ITER_BUDGET_S": "15",
              "FUZZ_TOTAL_BUDGET_S": "120",
              "RUBBISH_STRESS_SUITE_BUDGET_S": "540",
          }
          if os.environ["RUNNER_OS"] == "Windows":
              values["REQUIRE_WINDOWS_LINK_CYCLE"] = "1"
          elif os.environ["RUNNER_OS"] == "Linux":
              values["REQUIRE_POSIX_LINK_CYCLE"] = "1"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(key + "=" + value + "\n")
          PY

      - name: Run stress suite
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          budget = int(os.environ["RUBBISH_STRESS_SUITE_BUDGET_S"])
          try:
              completed = subprocess.run(
                  [sys.executable, "-m", "pytest", "tests/stress/", "-m", "stress", "-x", "--tb=short", "-vv"],
                  timeout=budget,
              )
          except subprocess.TimeoutExpired:
              raise SystemExit("stress suite exceeded fixed internal %ss deadline" % budget)
          raise SystemExit(completed.returncode)
          PY

      - name: Assert required link-cycle coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(os.environ["RUBBISH_STRESS_STATUS_FILE"])
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit("link-cycle status missing or invalid: %s" % error)
          required = {"status", "kind", "reason", "platform"}
          if set(payload) != required:
              raise SystemExit("link-cycle status schema mismatch: %r" % payload)
          if payload["status"] != "executed" or payload["kind"] not in {"junction", "symlink"}:
              raise SystemExit("required link cycle did not execute: %r" % payload)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## Stress link-cycle coverage\n\n```json\n")
              stream.write(json.dumps(payload, sort_keys=True))
              stream.write("\n```\n")
          print("LINK_CYCLE_STATUS=" + json.dumps(payload, sort_keys=True))
          PY
